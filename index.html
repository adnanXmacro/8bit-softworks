<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="description" content="Android apps by 8BiT Softworks. Download Quiz Chaos and Open Tube straight from GitHub. No Play Store account required.">

    <meta property="og:title" content="8BiT Softworks — Android apps">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <body>
    <header class="site-header">
      <a class="brand-lockup" href="./" aria-label="8BiT Softworks home">
        <svg class="brand-mark" viewBox="0 0 64 64" role="img" aria-hidden="true">
          <defs>
            <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff5566"/>

              <stop offset="1" stop-color="#a80e1c"/>
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="15" fill="#0a0a0c"/>
          <rect x="2" y="2" width="60" height="60" rx="13.5" fill="none" stroke="url(#brand)" stroke-width="2.5"/>
          <text x="32" y="31" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#f4f4f6" text-anchor="middle">8</text>
          <text x="32" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="800" fill="url(#brand)" text-anchor="middle">B</text>

        <span class="brand-text">

      <span class="header-spacer"></span>
      <a class="header-link" href="#apps">Apps</a>

    <main class="wrap">
      <section class="page-intro">
        <p class="eyebrow">App catalog</p>
        <h1 class="page-title">Apps</h1>

      </section>
      <div id="apps" data-store></div>
    </main>
    <footer class="footer">
      <strong>8BiT Softworks</strong><span class="dot">•</span>Independent Android apps<span class="dot">•</span>Install from GitHub
    </footer>
    <script type="module">
      import { mountCatalog } from './js/store.js';
      mountCatalog(document.querySelector('[data-store]'));
    </script>
  </body>
</html>
